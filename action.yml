# Action description and parameters
name: 'SOFA Setup Action'
description: 'Setup everything needed to build a SOFA plugin'
inputs:
  sofa_root:
    description: 'SOFA install directory to get Regression binary, set SOFA_ROOT variable and append the PYTHONPATH env variable'
    required: true
  src_dir:
    description: 'Directory of the sources of the plugin to be tested (regression file will be looked for in example folder)'
    required: true
  build_dir:
    description: 'Build directory of the plugin. Used to include bindings if some are compiled by this plugin'
    required: false
  python_exe:
    description: 'path to python executable'
    required: true
  run_unit_tests:
    description: 'If true, will run the unit tests found in the build_dir/bin'
    required: false
    default: 'true'
  run_scene_tests:
    description: 'If true, will run all the scene found under src_dir/examples'
    required: false
    default: 'true'
  run_regression_tests:
    description: 'If true, will run the regression tests found in the src_dir/examples'
    required: false
    default: 'true'
  nb_parallel_threads:
    description: 'Tests will be run in parallel, this is the maximum number of thread allowed'
    required: false
    default: '1'
  ci_dir:
    description: 'Directory of the clone of the ci repository. If none is given, the plugin will be fetched by this action'
    required: false
  regression_dir:
    description: 'Directory of the clone of the Regression repository. If none is given, the plugin will be fetched by this action'
    required: false
  publish_logs:
    description: 'Boolean stating if the logs should be directly published by the action'
    required: false
    default: 'true'
outputs:
  unit_test_results:
    description: "Log file containing scene tests results"
    value: ${{ steps.set-env-vars.outputs.scene_test_results_path }}
  unit_test_results_path:
    description: "Log file containing scene tests results"
    value: ${{ steps.set-env-vars.outputs.scene_test_results_path }}
  scene_test_results:
    description: "Log file containing scene tests results"
    value: ${{ steps.set-env-vars.outputs.scene_test_results_path }}
  scene_test_results_path:
    description: "Log file containing scene tests results"
    value: ${{ steps.set-env-vars.outputs.scene_test_results_path }}
  regression_test_results:
    description: "Log file containing regression tests results"
    value: ${{ steps.set-env-vars.outputs.regression_test_results_path }}
  regression_test_results_path:
    description: "Log file containing regression tests results"
    value: ${{ steps.set-env-vars.outputs.regression_test_results_path }}

runs:
  using: "composite"
  steps:

    - name: Clone missing CI plugin 
      uses: actions/checkout@v4
      if: inputs.ci_dir == ''
      with:
        repository: 'sofa-framework/ci'
        ref: 'master'
        path: ci

    - name: Clone missing Regression plugin 
      uses: actions/checkout@v4
      if: inputs.regression_dir == ''
      with:
        repository: 'sofa-framework/Regression'
        ref: 'master'
        path: Regression

    - name: Setup environement for tests
      shell: bash
      run: |

        CI_DIR=${{ inputs.ci_dir }}
        if [[ -z "$CI_DIR" ]]; then
            CI_DIR="${{ github.workspace }}/ci"
        fi
        echo "CI_DIR=$CI_DIR" >> $GITHUB_ENV
        
        REGRESSION_DIR=${{ inputs.regression_dir }}
        if [[ -z "$REGRESSION_DIR" ]]; then
            REGRESSION_DIR="${{ github.workspace }}/Regression"
        fi
        echo "REGRESSION_DIR=$REGRESSION_DIR" >> $GITHUB_ENV
        


        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "${{ inputs.build_dir }}/lib" >> $GITHUB_PATH
          echo "${{ inputs.build_dir }}/bin" >> $GITHUB_PATH

          pythonroot="$(dirname ${{ inputs.python_exe }})"
          pythonroot="$(cd "$pythonroot" && pwd)"
          echo "$pythonroot" >> $GITHUB_PATH
          echo "$pythonroot/DLLs" >> $GITHUB_PATH
          echo "$pythonroot/Lib" >> $GITHUB_PATH

          echo "${{ inputs.sofa_root }}/plugins/SofaPython3/bin" >> $GITHUB_PATH
          echo "SOFA_PLUGIN_PATH=${{ inputs.build_dir }}/bin" | tee -a $GITHUB_ENV
          
        else
          echo "SOFA_PLUGIN_PATH=${{ inputs.build_dir }}/lib" | tee -a $GITHUB_ENV
        fi

        if [[ "$RUNNER_OS" == "macOS" ]]; then
          echo "DYLD_LIBRARY_PATH=${{ inputs.build_dir }}/lib:${{ inputs.sofa_root }}/lib:${{ inputs.sofa_root }}/plugins/SofaPython3/lib:$DYLD_LIBRARY_PATH" | tee -a $GITHUB_ENV
        fi

        if [[ "$RUNNER_OS" == "Linux" ]]; then
          echo "LD_LIBRARY_PATH=${{ inputs.build_dir }}/lib:${{ inputs.sofa_root }}/lib:${{ inputs.sofa_root }}/plugins/SofaPython3/lib:$LD_LIBRARY_PATH" | tee -a $GITHUB_ENV
        fi

        echo "SOFA_ROOT=${{ inputs.sofa_root }}"  | tee -a $GITHUB_ENV

    - name: Launch unit tests
      if: inputs.run_unit_tests == 'true'
      shell: bash
      run: |
        /bin/bash "$CI_DIR/scripts/unit-tests.sh" run unit "${{ inputs.build_dir }}" "${{ inputs.src_dir }}" ${{ inputs.nb_parallel_threads }}
        /bin/bash "$CI_DIR/scripts/unit-tests.sh" print-summary unit "${{ inputs.build_dir }}" "${{ inputs.src_dir }}" ${{ inputs.nb_parallel_threads }}

        echo "tests_suites=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-test-suites unit ${{ inputs.build_dir }} ${{ inputs.src_dir }})" > ${{ inputs.build_dir }}/unit-tests/unit-tests_results.txt
        echo "tests_total=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-tests unit ${{ inputs.build_dir }} ${{ inputs.src_dir }})" >> ${{ inputs.build_dir }}/unit-tests/unit-tests_results.txt
        echo "tests_disabled=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-disabled unit ${{ inputs.build_dir }} ${{ inputs.src_dir }})" >> ${{ inputs.build_dir }}/unit-tests/unit-tests_results.txt
        echo "tests_failures=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-failures unit ${{ inputs.build_dir }} ${{ inputs.src_dir }})" >> ${{ inputs.build_dir }}/unit-tests/unit-tests_results.txt
        echo "tests_errors=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-errors unit ${{ inputs.build_dir }} ${{ inputs.src_dir }})" >> ${{ inputs.build_dir }}/unit-tests/unit-tests_results.txt
        echo "tests_duration=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-durations unit ${{ inputs.build_dir }} ${{ inputs.src_dir }})" >> ${{ inputs.build_dir }}/unit-tests/unit-tests_results.txt


    - name: Launch scene tests
      if: inputs.run_scene_tests == 'true'
      shell: bash
      run: |
        /bin/bash "$CI_DIR/scripts/scene-tests.sh" run "${{ inputs.build_dir }}" "${{ inputs.src_dir }}" ${{ inputs.nb_parallel_threads }}
        /bin/bash "$CI_DIR/scripts/scene-tests.sh" print-summary "${{ inputs.build_dir }}" "${{ inputs.src_dir }}" ${{ inputs.nb_parallel_threads }}

        echo "scenes_total=$(/bin/bash $CI_DIR/scripts/scene-tests.sh count-tested-scenes ${{ inputs.build_dir }} ${{ inputs.src_dir }})" > ${{ inputs.build_dir }}/scene-tests/scene-tests_results.txt
        echo "scenes_successes=$(/bin/bash "$CI_DIR/scripts/scene-tests.sh" count-successes ${{ inputs.build_dir }} ${{ inputs.src_dir }})" >> ${{ inputs.build_dir }}/scene-tests/scene-tests_results.txt
        echo "scenes_errors=$(/bin/bash "$CI_DIR/scripts/scene-tests.sh" count-errors ${{ inputs.build_dir }} ${{ inputs.src_dir }})" >> ${{ inputs.build_dir }}/scene-tests/scene-tests_results.txt
        echo "scenes_crashes=$(/bin/bash "$CI_DIR/scripts/scene-tests.sh" count-crashes ${{ inputs.build_dir }} ${{ inputs.src_dir }})" >> ${{ inputs.build_dir }}/scene-tests/scene-tests_results.txt
        echo "scenes_duration=$(/bin/bash "$CI_DIR/scripts/scene-tests.sh" count-durations ${{ inputs.build_dir }} ${{ inputs.src_dir }})" >> ${{ inputs.build_dir }}/scene-tests/scene-tests_results.txt


    - name: Launch regression tests
      if: inputs.run_regression_tests == 'true'
      shell: bash
      run: |
        /bin/bash "$CI_DIR/scripts/unit-tests.sh" run regression "${{ inputs.build_dir }}" "${{ inputs.src_dir }}" ${{ inputs.nb_parallel_threads }}
        /bin/bash "$CI_DIR/scripts/unit-tests.sh" print-summary regression "${{ inputs.build_dir }}" "${{ inputs.src_dir }}" ${{ inputs.nb_parallel_threads }}

        echo "regressions_suites=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-test-suites regression ${{ inputs.build_dir }} ${{ inputs.src_dir }} )" > ${{ inputs.build_dir }}/regression-tests/regression-tests_results.txt
        echo "regressions_total=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-tests regression ${{ inputs.build_dir }} ${{ inputs.src_dir }} )" >> ${{ inputs.build_dir }}/regression-tests/regression-tests_results.txt
        echo "regressions_disabled=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-disabled regression ${{ inputs.build_dir }} ${{ inputs.src_dir }} )" >> ${{ inputs.build_dir }}/regression-tests/regression-tests_results.txt
        echo "regressions_failures=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-failures regression ${{ inputs.build_dir }} ${{ inputs.src_dir }} )" >> ${{ inputs.build_dir }}/regression-tests/regression-tests_results.txt
        echo "regressions_errors=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-errors regression ${{ inputs.build_dir }} ${{ inputs.src_dir }} )" >> ${{ inputs.build_dir }}/regression-tests/regression-tests_results.txt
        echo "regressions_duration=$(/bin/bash "$CI_DIR/scripts/unit-tests.sh" count-durations regression ${{ inputs.build_dir }} ${{ inputs.src_dir }} )" >> ${{ inputs.build_dir }}/regression-tests/regression-tests_results.txt


    - name: Publish logs
      shell: bash
      run: |
        echo TODO

